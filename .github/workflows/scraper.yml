name: Crawl4AI Automated Scraper

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: 🕷️ 執行爬蟲腳本
        run: python scraper.py

      - name: 💾 將資料 Commit 並 Push 回 GitHub
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add output.md
          git commit -m "docs: Auto-update scraped data using Crawl4AI" || echo "No changes to commit"
          git push
