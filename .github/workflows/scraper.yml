name: Crawl4AI Automated Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 時間 0 點執行（台灣時間早上 8 點）
  workflow_dispatch: # 允許在 GitHub Actions 頁面上手動點擊執行

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢出程式碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Crawl4AI 底層依賴 Playwright，需安裝瀏覽器環境
          playwright install chromium

      - name: 🕷️ 執行 Crawl4AI 爬蟲腳本
        run: python scraper.py

      - name: 💾 將抓取到的資料 Commit 並 Push 回 GitHub
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add output.md
          git commit -m "docs: Auto-update scraped data using Crawl4AI" || echo "No changes to commit"
          git push
